kind = "web"
previewPath = "/"
title = "My Engineering Project"
version = "1.0.0"
id = "artifacts/my-engineering-project"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21837
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/my-engineering-project run dev"

[services.env]
PORT = "21837"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/my-engineering-project", "run", "build"]
publicDir = "artifacts/my-engineering-project/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/introduction"
to = "/introduction.html"

[[services.production.rewrites]]
from = "/introduction/"
to = "/introduction.html"

[[services.production.rewrites]]
from = "/faq"
to = "/faq.html"

[[services.production.rewrites]]
from = "/faq/"
to = "/faq.html"

